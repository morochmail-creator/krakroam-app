<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KrakRoam</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #14110d;
    --map-bg: #14110d;
    --panel: #1f1a13;
    --panel-2: #262019;
    --line: #362e22;
    --cream: #f3ead9;
    --cream-dim: #cabfa9;
    --amber: #c9932c;
    --amber-soft: #e0ac48;
    --moss: #5c7a63;
    --moss-soft: #7c9b83;
    --shadow: 0 12px 32px rgba(0,0,0,0.45);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--cream);
  }
  h1, h2, h3, .display { font-family: 'Fraunces', Georgia, serif; }

  #app { position: relative; width: 100%; height: 100dvh; }
  #map { position: absolute; inset: 0; z-index: 1; background: var(--map-bg); transition: background 0.3s ease; }
  .leaflet-container { background: var(--map-bg); transition: background 0.3s ease; }
  .leaflet-tile { will-change: auto; }
  #map .leaflet-tile-pane {
    filter: invert(1) hue-rotate(180deg) brightness(0.92) contrast(0.9) saturate(0.5);
    transition: filter 0.3s ease;
  }
  #app[data-map-mode="light"] #map .leaflet-tile-pane,
  #app[data-map-mode="satellite"] #map .leaflet-tile-pane {
    filter: none;
  }
  #app[data-map-mode="light"] #map-tint {
    background: linear-gradient(180deg, rgba(20,17,13,0.15) 0%, rgba(20,17,13,0) 18%, rgba(20,17,13,0) 70%, rgba(20,17,13,0.25) 100%);
  }

  #map-tint {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: linear-gradient(180deg, rgba(20,17,13,0.35) 0%, rgba(20,17,13,0) 18%, rgba(20,17,13,0) 70%, rgba(20,17,13,0.55) 100%);
  }

  #topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px;
  }
  #brand {
    font-size: 20px; font-weight: 600; letter-spacing: 0.01em;
    color: var(--cream);
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
  }
  #brand span { color: var(--amber-soft); }
  #btn-stack {
    display: flex; flex-direction: column; gap: 10px;
    position: relative;
  }
  #locate-btn, #layers-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--panel); border: 1px solid var(--line);
    box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  #locate-btn svg, #layers-btn svg { width: 20px; height: 20px; stroke: var(--cream); }
  #locate-btn.active svg { stroke: var(--amber-soft); }
  #layers-btn.active svg { stroke: var(--amber-soft); }

  #layers-menu {
    position: absolute; top: 0; right: 54px; z-index: 15;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: var(--shadow);
    padding: 6px; min-width: 150px;
    display: none;
    flex-direction: column; gap: 2px;
  }
  #layers-menu.open { display: flex; }
  .layer-option {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 9px;
    cursor: pointer; font-size: 13px; color: var(--cream-dim);
  }
  .layer-option:hover { background: var(--panel-2); }
  .layer-option.active { background: var(--panel-2); color: var(--cream); font-weight: 600; }
  .layer-option .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--line); flex-shrink: 0;
  }
  .layer-option.active .dot { background: var(--amber-soft); }

  #intro-card {
    position: absolute; bottom: 18px; left: 16px; right: 16px; z-index: 10;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 14px 16px;
    box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 12px;
    transition: transform 0.25s ease, opacity 0.25s ease;
  }
  #intro-card.hidden { transform: translateY(16px); opacity: 0; pointer-events: none; }
  #intro-play {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%;
    background: var(--amber); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #intro-play svg { width: 16px; height: 16px; fill: var(--bg); }
  #intro-text { flex: 1; }
  #intro-text .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--amber-soft); margin-bottom: 2px; }
  #intro-text .title { font-size: 14px; color: var(--cream); }
  #intro-close { background: none; border: none; color: var(--cream-dim); font-size: 20px; cursor: pointer; padding: 4px; line-height: 1; }

  .marker-main {
    width: 26px; height: 26px; border-radius: 50%;
    background: #2fd16f;
    border: 3px solid #14110d;
    box-shadow: 0 3px 10px rgba(0,0,0,0.5);
  }
  .marker-start {
    width: 26px; height: 26px; border-radius: 50%;
    background: #2fd16f;
    border: 3px solid #14110d;
    box-shadow: 0 0 0 5px rgba(47,209,111,0.35), 0 3px 10px rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .marker-start::after {
    content: "\1F3C1";
    position: absolute;
    top: -22px; left: 50%; transform: translateX(-50%);
    font-size: 18px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
  }

  /* ---------- Klastry (bąbelki grupujące piny przy oddaleniu) ---------- */
  .cluster-main, .cluster-extra {
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #14110d; font-weight: 700; font-family: 'Inter', sans-serif;
    border: 3px solid #14110d;
    box-shadow: 0 3px 12px rgba(0,0,0,0.5);
  }
  .cluster-main { background: #2fd16f; }
  .cluster-extra { background: var(--amber); color: #14110d; }
  .cluster-sm { width: 34px; height: 34px; font-size: 13px; }
  .cluster-md { width: 42px; height: 42px; font-size: 15px; }
  .cluster-lg { width: 50px; height: 50px; font-size: 16px; }

  .marker-extra {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--amber);
    border: 2px solid #14110d;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .gps-wrap {
    position: relative;
    width: 90px; height: 90px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .gps-beam {
    position: absolute; top: 50%; left: 50%;
    width: 90px; height: 90px;
    margin-top: -45px; margin-left: -45px;
    background: conic-gradient(from 0deg, rgba(74,144,217,0.5) 0deg, rgba(74,144,217,0.5) 70deg, rgba(74,144,217,0) 70deg, rgba(74,144,217,0) 360deg);
    border-radius: 50%;
    transform: rotate(-35deg);
    transition: transform 0.2s linear;
    mask-image: radial-gradient(circle, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.15) 100%);
    -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.15) 100%);
  }
  .gps-dot {
    position: relative; z-index: 2;
    width: 18px; height: 18px; border-radius: 50%;
    background: #4a90d9;
    border: 3px solid #fff;
    box-shadow: 0 0 0 6px rgba(74,144,217,0.25), 0 2px 6px rgba(0,0,0,0.4);
  }

  #sheet-backdrop {
    position: absolute; inset: 0; z-index: 19;
    background: rgba(10,8,6,0.45);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #sheet-backdrop.open { opacity: 1; pointer-events: auto; }

  #sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--panel);
    border-top: 1px solid var(--line);
    border-radius: 22px 22px 0 0;
    box-shadow: 0 -12px 40px rgba(0,0,0,0.55);
    padding: 10px 18px 22px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(.32,.72,0,1);
  }
  #sheet.open { transform: translateY(0); }

  #sheet-handle {
    width: 36px; height: 4px; border-radius: 2px;
    background: var(--line); margin: 6px auto 14px;
  }

  #sheet-kicker { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--amber-soft); margin-bottom: 4px; }
  #sheet-title { font-size: 22px; font-weight: 600; margin: 0 0 16px; color: var(--cream); }

  #track-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; max-height: 34vh; overflow-y: auto; }
  .track-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 12px;
    background: var(--panel-2); border: 1px solid var(--line);
    cursor: pointer; text-align: left;
  }
  .track-row.active { background: var(--amber); border-color: var(--amber); }
  .track-row .tr-num {
    flex-shrink: 0; font-family: 'Fraunces', Georgia, serif;
    font-size: 15px; font-weight: 600; color: var(--amber-soft);
    min-width: 28px;
  }
  .track-row.active .tr-num { color: rgba(20,17,13,0.65); }
  .track-row .tr-name { font-size: 14px; font-weight: 500; color: var(--cream); flex: 1; }
  .track-row.active .tr-name { color: var(--bg); }
  .track-row .tr-icon { flex-shrink: 0; width: 16px; height: 16px; opacity: 0.6; }
  .track-row.active .tr-icon { opacity: 0.75; }

  #player {
    display: flex; align-items: center; gap: 14px;
    background: var(--panel-2); border-radius: 16px; padding: 12px 14px;
  }
  #play-btn {
    flex-shrink: 0; width: 46px; height: 46px; border-radius: 50%;
    background: var(--amber); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #play-btn svg { width: 18px; height: 18px; fill: var(--bg); }
  #player-mid { flex: 1; min-width: 0; }
  #progress-track { height: 4px; background: var(--line); border-radius: 2px; position: relative; cursor: pointer; }
  #progress-fill { height: 100%; width: 0%; background: var(--amber-soft); border-radius: 2px; }
  #time-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--cream-dim); margin-top: 6px; }

  #sheet-close {
    position: absolute; top: 14px; right: 16px;
    background: none; border: none; color: var(--cream-dim);
    font-size: 22px; cursor: pointer; line-height: 1; padding: 6px;
  }

  .no-audio-note {
    font-size: 12px; color: var(--cream-dim); margin-top: 10px; text-align: center;
  }
</style>
</head>
<body>

<div id="app">
  <div id="map"></div>
  <div id="map-tint"></div>

  <div id="topbar">
    <div id="brand">Krak<span>Roam</span></div>
    <div id="btn-stack">
      <button id="locate-btn" aria-label="Pokaż moją lokalizację">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
        </svg>
      </button>
      <button id="layers-btn" aria-label="Wybierz widok mapy">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12,2 2,7 12,12 22,7"></polygon>
          <polyline points="2,17 12,22 22,17"></polyline>
          <polyline points="2,12 12,17 22,12"></polyline>
        </svg>
      </button>
      <div id="layers-menu">
        <div class="layer-option active" data-mode="dark"><span class="dot"></span>Ciemna</div>
        <div class="layer-option" data-mode="light"><span class="dot"></span>Jasna</div>
        <div class="layer-option" data-mode="satellite"><span class="dot"></span>Satelita</div>
      </div>
    </div>
  </div>

  <div id="intro-card">
    <button id="intro-play" aria-label="Odtwórz wprowadzenie">
      <svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"></polygon></svg>
    </button>
    <div id="intro-text">
      <div class="label">Trasa królewska · Wprowadzenie</div>
      <div class="title">Zanim wyruszysz, posłuchaj krótkiej historii trasy</div>
    </div>
    <button id="intro-close" aria-label="Zamknij">×</button>
  </div>

  <div id="sheet-backdrop"></div>

  <div id="sheet">
    <button id="sheet-close" aria-label="Zamknij">×</button>
    <div id="sheet-handle"></div>
    <div id="sheet-kicker">Punkt główny</div>
    <h2 id="sheet-title">—</h2>

    <div id="track-list"></div>

    <div id="player">
      <button id="play-btn" aria-label="Odtwórz">
        <svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"></polygon></svg>
      </button>
      <div id="player-mid">
        <div id="progress-track"><div id="progress-fill"></div></div>
        <div id="time-row"><span id="time-current">0:00</span><span id="time-total">0:00</span></div>
      </div>
    </div>
    <div class="no-audio-note" id="no-audio-note" style="display:none;">Plik audio jeszcze nie został dodany dla tego punktu.</div>
  </div>
</div>

<audio id="audio-el" preload="none"></audio>

/* ============================================================
   WSTĘPNE DOŁADOWANIE KAFELKÓW DLA CAŁEGO OBSZARU TRASY
   Żeby szybkie przesuwanie mapy w obrębie Starego Miasta nie
   "gubiło" kafelków czekających na sieć — ładujemy je wszystkie
   po cichu w tle zaraz po starcie, zanim user zacznie przewijać.
============================================================ */
function prefetchTilesForRoute() {
  const allPoints = POINTS.map(p => [p.lat, p.lng]).concat(ROUTE_LINE);
  if (!allPoints.length) return;

  let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
  allPoints.forEach(([lat, lng]) => {
    if (lat < minLat) minLat = lat;
    if (lat > maxLat) maxLat = lat;
    if (lng < minLng) minLng = lng;
    if (lng > maxLng) maxLng = lng;
  });
  // mały zapas na krawędziach
  const pad = 0.002;
  minLat -= pad; maxLat += pad; minLng -= pad; maxLng += pad;

  function lonToTileX(lon, z) { return Math.floor((lon + 180) / 360 * Math.pow(2, z)); }
  function latToTileY(lat, z) {
    const rad = lat * Math.PI / 180;
    return Math.floor((1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * Math.pow(2, z));
  }

  const zooms = [16, 17, 18];
  const subdomains = ['a', 'b', 'c'];
  let sdIndex = 0;
  const queue = [];

  zooms.forEach(z => {
    const xMin = lonToTileX(minLng, z), xMax = lonToTileX(maxLng, z);
    const yMin = latToTileY(maxLat, z), yMax = latToTileY(minLat, z);
    for (let x = xMin; x <= xMax; x++) {
      for (let y = yMin; y <= yMax; y++) {
        queue.push({ x, y, z });
      }
    }
  });

  // ładujemy partiami, żeby nie zablokować przeglądarki ani nie zarzucić serwera naraz
  let i = 0;
  function loadNext() {
    const batch = queue.slice(i, i + 6);
    if (!batch.length) return;
    batch.forEach(t => {
      const sd = subdomains[sdIndex++ % subdomains.length];
      const img = new Image();
      img.src = `https://${sd}.tile.openstreetmap.org/${t.z}/${t.x}/${t.y}.png`;
    });
    i += 6;
    setTimeout(loadNext, 120);
  }
  loadNext();
}

function makeDivIcon(className, size) {
  return L.divIcon({ className: '', html: `<div class="${className}"></div>`, iconSize: [size, size] });

function clusterIconFactory(cssClass) {
  return function (cluster) {
    const count = cluster.getChildCount();
    const sizeClass = count < 5 ? 'cluster-sm' : count < 12 ? 'cluster-md' : 'cluster-lg';
    return L.divIcon({
      html: `<div class="${cssClass} ${sizeClass}">${count}</div>`,
      className: '',
      iconSize: L.point(40, 40)
    });
  };
}

   GPS
============================================================ */
let gpsMarker = null;
let guideLine = null;
let watching = false;
let watchId = null;
let lastRoutedLatLng = null;
let routingInFlight = false;

const startLatLng = [startPoint.lat, startPoint.lng];

/* ---------- Kompas: kierunek, w którym patrzy telefon ---------- */
let compassStarted = false;
let currentBeamRotation = -35; // aktualna wartość kąta zastosowana do transformu (może przekraczać 0-360, żeby liczyć "najkrótszą drogę")

function updateBeamRotation(heading) {
  if (!gpsMarker) return;
  const el = gpsMarker.getElement();
  if (!el) return;
  const beam = el.querySelector('.gps-beam');
  if (!beam) return;

  const target = heading - 35;
  // liczymy najkrótszą różnicę kątową (-180..180), żeby stożek nigdy nie "skakał" przy przejściu przez 0/360
  let diff = ((target - currentBeamRotation + 540) % 360) - 180;
  currentBeamRotation += diff;
  beam.style.transform = `rotate(${currentBeamRotation}deg)`;
}

function handleOrientation(e) {
  let heading;
  if (typeof e.webkitCompassHeading === 'number') {
    heading = e.webkitCompassHeading; // iOS Safari — już zgodnie z ruchem wskazówek zegara od północy
  } else if (e.absolute && e.alpha !== null && e.alpha !== undefined) {
    heading = 360 - e.alpha; // Android / inne przeglądarki
  } else {
    return;
  }
  updateBeamRotation(heading);
}

function startCompass() {
  if (compassStarted) return;
  compassStarted = true;
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    // iOS 13+ wymaga zgody użytkownika, poproszonej w ramach kliknięcia
    DeviceOrientationEvent.requestPermission().then(state => {
      if (state === 'granted') {
        window.addEventListener('deviceorientation', handleOrientation, true);
      }
    }).catch(() => {});
  } else if ('ondeviceorientationabsolute' in window) {
    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
  } else if (typeof DeviceOrientationEvent !== 'undefined') {
    window.addEventListener('deviceorientation', handleOrientation, true);
  }
}

function drawGuideLine(latlngs) {
  if (guideLine) {
    guideLine.setLatLngs(latlngs);
  } else {
    guideLine = L.polyline(latlngs, {
      color: '#4a90d9', weight: 3, opacity: 0.75, dashArray: '2,10', lineCap: 'round'
    }).addTo(map);
  }
}

function distMeters(a, b) {
  return L.latLng(a).distanceTo(L.latLng(b));
}

async function requestWalkingRoute(userLatLng) {
  if (routingInFlight) return;
  if (lastRoutedLatLng && distMeters(userLatLng, lastRoutedLatLng) < 30) return;
  routingInFlight = true;
  lastRoutedLatLng = userLatLng;
  // najpierw rysujemy prostą linię jako natychmiastowy fallback, podmienimy ją jak przyjdzie trasa
  drawGuideLine([userLatLng, startLatLng]);
  try {
    const url = `https://routing.openstreetmap.de/routed-foot/route/v1/foot/${userLatLng[1]},${userLatLng[0]};${startLatLng[1]},${startLatLng[0]}?overview=full&geometries=geojson`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.routes && data.routes[0]) {
      const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
      drawGuideLine(coords);
    }
  } catch (e) {
    // zostaje prosta linia jako fallback — brak połączenia albo serwis niedostępny
  } finally {
    routingInFlight = false;
  }
}

document.getElementById('locate-btn').addEventListener('click', () => {
  const btn = document.getElementById('locate-btn');
  if (!navigator.geolocation) {
    alert('Twoja przeglądarka nie obsługuje lokalizacji GPS.');
    return;
  }


  // Jeśli lokalizacja jest już śledzona — drugie kliknięcie po prostu
  // "przelatuje" z powrotem do aktualnej pozycji (jak w Google Maps).
  if (watching) {
    if (gpsMarker) {
      map.flyTo(gpsMarker.getLatLng(), 17, { duration: 1.1 });
    }
    return;
  }

  btn.classList.add('active');
  watching = true;
  let firstFix = true;
  startCompass(); // musi wystartować od razu w kliknięciu — iOS wymaga zgody w ramach gestu użytkownika

  watchId = navigator.geolocation.watchPosition(pos => {
    const { latitude, longitude } = pos.coords;
    const userLatLng = [latitude, longitude];
    if (!gpsMarker) {
      const gpsIcon = L.divIcon({
        className: '',
        html: '<div class="gps-wrap"><div class="gps-beam"></div><div class="gps-dot"></div></div>',
        iconSize: [90, 90]
      });
      gpsMarker = L.marker(userLatLng, { icon: gpsIcon }).addTo(map);
    } else {
      gpsMarker.setLatLng(userLatLng);
    }
    if (firstFix) {
      map.flyTo(userLatLng, 17, { duration: 1.4 });
      firstFix = false;
    }
    requestWalkingRoute(userLatLng);
  }, err => {
    alert('Nie udało się pobrać lokalizacji: ' + err.message);
    btn.classList.remove('active');
    watching = false;
  }, { enableHighAccuracy: true });
});

function renderTrackList() {

  if (!currentPoint) return;
  currentPoint.tracks.forEach((track, i) => {
    const row = document.createElement('div');
    row.className = 'track-row' + (i === currentTrackIndex ? ' active' : '');
    row.innerHTML = `

    `;
    row.addEventListener('click', () => {
      currentTrackIndex = i;
      renderTrackList();
      loadTrack();
    });
    trackListEl.appendChild(row);
  });
}

function loadTrack() {
  if (!currentPoint) return;
  const track = currentPoint.tracks[currentTrackIndex];
  const src = track ? track.audio : null;
  audioEl.pause();
  setPlayIcon(false);
  progressFill.style.width = '0%';
  timeCurrent.textContent = '0:00';
  timeTotal.textContent = '0:00';
  if (src) {
    noAudioNote.style.display = 'none';
    playerEl.style.opacity = '1';
    playerEl.style.pointerEvents = 'auto';
    audioEl.src = src;
  } else {
    noAudioNote.style.display = 'block';
    playerEl.style.opacity = '0.4';
    playerEl.style.pointerEvents = 'none';
    audioEl.removeAttribute('src');
  }
}

/* ============================================================
   AUDIO PLAYER
============================================================ */
const audioEl = document.getElementById('audio-el');
const playBtn = document.getElementById('play-btn');
const progressFill = document.getElementById('progress-fill');
const progressTrack = document.getElementById('progress-track');
const timeCurrent = document.getElementById('time-current');
const timeTotal = document.getElementById('time-total');

function fmtTime(s) {
  if (!isFinite(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}

function setPlayIcon(isPlaying) {
  playBtn.innerHTML = isPlaying
    ? '<svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16"></rect><rect x="14" y="4" width="5" height="16"></rect></svg>'
    : '<svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"></polygon></svg>';
}

playBtn.addEventListener('click', () => {
  if (!audioEl.src) return;
  if (audioEl.paused) { audioEl.play(); setPlayIcon(true); }
  else { audioEl.pause(); setPlayIcon(false); }
});

audioEl.addEventListener('timeupdate', () => {
  if (!audioEl.duration) return;
  const pct = (audioEl.currentTime / audioEl.duration) * 100;
  progressFill.style.width = pct + '%';
  timeCurrent.textContent = fmtTime(audioEl.currentTime);
});
audioEl.addEventListener('loadedmetadata', () => {
  timeTotal.textContent = fmtTime(audioEl.duration);
});
audioEl.addEventListener('ended', () => setPlayIcon(false));

progressTrack.addEventListener('click', (e) => {
  if (!audioEl.duration) return;
  const rect = progressTrack.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audioEl.currentTime = pct * audioEl.duration;
});

function playAudioSrc(src) {
  audioEl.src = src;
  audioEl.play();
  setPlayIcon(true);
}
</script>
