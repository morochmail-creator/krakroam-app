<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #14110d; --dark-2: #1f1a14; --paper: #fafaf8; --paper-2: #f1efe9;
    --ink: #1b1a17; --ink-dim: #716b60; --line: #e4e0d6;
    --gold: #f2b01e; --gold-deep: #a9802f; --gold-tint: #f3e6c8;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--paper); color: var(--ink); line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }

  header { position: fixed; top: 0; left: 0; right: 0; z-index: 20; transition: background .2s, box-shadow .2s; }
  header.solid, header.open { background: rgba(20,17,13,0.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 6px 20px rgba(0,0,0,0.25); }
  .burger { width: 46px; height: 46px; border: 0; border-radius: 14px; background: var(--gold); cursor: pointer; display: grid; place-items: center; padding: 0; box-shadow: 0 6px 18px rgba(242,176,30,0.35); }
  .burger span { display: block; width: 22px; height: 2.5px; background: var(--dark); border-radius: 2px; position: relative; transition: background .2s; }
  .burger span::before, .burger span::after { content: ""; position: absolute; left: 0; width: 22px; height: 2.5px; background: var(--dark); border-radius: 2px; transition: transform .2s, top .2s; }
  .burger span::before { top: -7px; } .burger span::after { top: 7px; }
  header.open .burger span { background: transparent; }
  header.open .burger span::before { top: 0; transform: rotate(45deg); }
  header.open .burger span::after { top: 0; transform: rotate(-45deg); }
  .menu { display: none; border-top: 1px solid rgba(255,255,255,0.08); }
  header.open .menu { display: block; }
  .menu ul { list-style: none; padding: 10px 0 22px; margin: 0; display: grid; gap: 2px; }
  .menu a { display: flex; align-items: center; gap: 12px; color: #fff; text-decoration: none; font-size: 20px; font-weight: 700; padding: 12px 4px; border-radius: 12px; }
  .menu a:hover { color: var(--gold); }
  .menu a.hl { color: var(--gold); }
  .menu .mcta { max-width: 360px; margin-top: 10px; justify-content: center; background: var(--gold); color: var(--dark); border-radius: 999px; font-size: 18px; }
  .menu .mcta:hover { color: var(--dark); }
  main [id] { scroll-margin-top: 84px; }
  header > .wrap { display: flex; align-items: center; justify-content: space-between; height: 68px; }
  .brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font-weight: 800; letter-spacing: -0.01em; }
  .brand img { width: 36px; height: 36px; border-radius: 9px; }

  .hero { background: linear-gradient(180deg, rgba(20,17,13,0.82) 0%, rgba(20,17,13,0.62) 45%, rgba(20,17,13,0.92) 100%), url('/www/img/wawel.jpg') center/cover no-repeat, var(--dark); color: #fff; text-align: center; padding: 100px 0 56px; overflow: hidden; }
  .hero h1 { font-size: clamp(30px, 6vw, 54px); line-height: 1.08; letter-spacing: -0.03em; font-weight: 800; max-width: 760px; margin: 0 auto; }
  .hero .logo { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 12px 36px rgba(242,176,30,0.18); margin-bottom: 18px; }
  .hero h1 em { font-style: normal; color: var(--gold); }
  .hero p { color: rgba(255,255,255,0.72); font-size: clamp(16px, 2.2vw, 19px); max-width: 560px; margin: 18px auto 0; }
  .cta { display: inline-flex; align-items: center; gap: 12px; margin-top: 36px; background: var(--gold); color: var(--dark); text-decoration: none; font-weight: 800; font-size: 18px; padding: 18px 30px; border-radius: 999px; box-shadow: 0 10px 30px rgba(242,176,30,0.35); transition: transform .15s, box-shadow .15s; }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(242,176,30,0.45); }
  .cta svg { width: 24px; height: 24px; }
  .cta .ver { font-size: 12px; font-weight: 700; background: var(--dark); color: var(--gold); border-radius: 999px; padding: 4px 8px; }
  .hero .cta { margin-top: 24px; }
  .hero small { display: block; margin-top: 14px; color: rgba(255,255,255,0.5); font-size: 13px; }

  .lang-pop { display: none; border-top: 1px solid rgba(255,255,255,0.08); padding: 14px 0 18px; }
  header.langs .lang-pop { display: block; }
  header.langs { background: rgba(20,17,13,0.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 6px 20px rgba(0,0,0,0.25); }
  .langs-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .lang-btn { display: inline-flex; align-items: center; gap: 9px; border: 2px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.08); color: #fff; font: 600 15px/1 inherit; font-family: inherit; padding: 9px 15px 9px 9px; border-radius: 999px; cursor: pointer; transition: background .15s, border-color .15s; }
  .lang-btn:hover { background: rgba(255,255,255,0.16); }
  .lang-btn.on { border-color: var(--gold); background: rgba(242,176,30,0.18); }
  .lang-btn svg { width: 30px; height: 20px; border-radius: 4px; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,0.25); }
  .hdr-flag { border: 0; font-family: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; color: #fff; text-decoration: none; font-weight: 700; font-size: 14px; background: rgba(255,255,255,0.1); padding: 6px 12px 6px 6px; border-radius: 999px; }
  .hdr-flag svg { width: 26px; height: 17px; border-radius: 3px; }
  .hdr-right { display: flex; align-items: center; gap: 14px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (max-width: 520px) { .hdr-link { display: none; } }
  .hdr-link { color: #fff; text-decoration: none; font-weight: 600; font-size: 14px; opacity: .9; }
  .hdr-link:hover { opacity: 1; text-decoration: underline; text-underline-offset: 4px; }
  html { scroll-behavior: smooth; }
  #o-nas { scroll-margin-top: 24px; }
  .about { display: grid; grid-template-columns: 220px 1fr; gap: 40px; align-items: start; margin-top: 8px; }
  .about-badge { background: var(--dark); border-radius: 24px; padding: 28px; display: grid; place-items: center; }
  .about-badge img { width: 100%; max-width: 160px; border-radius: 20px; }
  .about-text p { color: var(--ink); font-size: 17px; margin-top: 16px; max-width: 640px; }
  .about-text p.last { font-weight: 700; color: var(--gold-deep); }
  @media (max-width: 720px) { .about { grid-template-columns: 1fr; gap: 20px; } .about-badge { display: none; } }
  section { padding: 80px 0; }
  .kicker { color: var(--gold-deep); font-weight: 700; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
  h2 { font-size: clamp(26px, 4vw, 36px); letter-spacing: -0.02em; line-height: 1.15; margin-top: 8px; font-weight: 800; }
  .lead { color: var(--ink-dim); margin-top: 12px; max-width: 600px; font-size: 17px; }

  .samples-how { margin: 18px auto 0; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); border-radius: 18px; padding: 14px 16px; font-size: 15px; max-width: 640px; text-align: left; color: rgba(255,255,255,0.85); }
  .samples-how b { display: block; margin-bottom: 4px; color: var(--gold); }
  .samples { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin: 16px auto 0; max-width: 760px; text-align: left; }
  .sample { background: rgba(20,17,13,0.72); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color: #fff; border-radius: 22px; padding: 18px; display: grid; gap: 12px; }
  .sample .where { color: var(--gold); font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .sample h3 { font-size: 18px; font-weight: 800; margin-top: 2px; }
  .hero .sample p { color: rgba(255,255,255,0.7); font-size: 15px; margin: 4px 0 0; max-width: none; }
  .player { display: flex; align-items: center; gap: 14px; }
  .play { width: 56px; height: 56px; flex: none; border: 0; border-radius: 50%; background: var(--gold); color: var(--dark); display: grid; place-items: center; cursor: pointer; box-shadow: 0 8px 22px rgba(242,176,30,0.35); }
  .play svg { width: 24px; height: 24px; }
  .play .i-pause, .playing .play .i-play { display: none; }
  .playing .play .i-pause { display: block; }
  .bar { flex: 1; min-width: 0; }
  .track { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.18); position: relative; cursor: pointer; touch-action: none; }
  .track::after { content: ""; position: absolute; left: 0; right: 0; top: -12px; bottom: -12px; }
  .fill { height: 100%; width: 0; border-radius: 3px; background: var(--gold); position: relative; }
  .fill::after { content: ""; position: absolute; right: -8px; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px rgba(242,176,30,0.25); }
  .time { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,0.55); margin-top: 8px; font-variant-numeric: tabular-nums; }
  .samples-note:empty { display: none; }
  .samples-note { color: rgba(255,255,255,0.55); font-size: 13px; margin-top: 12px; }

  .gallery { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 200px; gap: 12px; margin-top: 40px; }
  .gallery figure { position: relative; margin: 0; border-radius: 18px; overflow: hidden; background: var(--paper-2); }
  .gallery img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s; }
  .gallery figure:hover img { transform: scale(1.04); }
  .gallery figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 14px 12px; color: #fff; font-weight: 700; font-size: 14px; background: linear-gradient(transparent, rgba(0,0,0,0.6)); }
  .gallery .big { grid-column: span 2; grid-row: span 2; }
  .gallery .wide { grid-column: span 2; }
  @media (max-width: 720px) {
    .gallery { grid-template-columns: 1fr 1fr; grid-auto-rows: 150px; }
    .gallery .big { grid-column: span 2; grid-row: span 2; }
    .gallery .wide { grid-column: span 2; }
  }

  .partners { background: var(--dark); color: #fff; border-radius: 28px; padding: 48px 32px; display: grid; gap: 24px; grid-template-columns: 1.4fr 1fr; align-items: center; }
  .partners .lead { color: rgba(255,255,255,0.7); }
  .partners .kicker { color: var(--gold); }
  .btn2 { display: inline-block; text-align: center; border: 2px solid var(--gold); color: var(--gold); text-decoration: none; font-weight: 700; padding: 14px 24px; border-radius: 999px; }
  .btn2:hover { background: var(--gold); color: var(--dark); }

  .final { text-align: center; padding-top: 0; }
  .final .cta { margin-top: 24px; }

  footer { border-top: 1px solid var(--line); padding: 28px 0; color: var(--ink-dim); font-size: 14px; }
  footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }

  @media (max-width: 720px) {
    .partners { grid-template-columns: 1fr; padding: 36px 22px; }
    section { padding: 60px 0; }
    .hero { padding: 88px 0 44px; }
  }
</style>
</head>

    var ORDER = ['pl', 'ua', 'en', 'de', 'es'];

    function set(l) {
      var d = T[l];

      row.querySelectorAll('.lang-btn').forEach(function (b) { b.classList.toggle('on', b.dataset.lang === l); });
      hdr.innerHTML = FLAGS[l] + l.toUpperCase();
      // aplikacja czyta ?lang= i od razu startuje w tym języku
      document.querySelectorAll('.app-link').forEach(function (a) { a.href = 'https://app.krakroam.pl/?lang=' + l; });
      try { localStorage.setItem('krakroam_site_lang', l); } catch (e) {}
    }
    // próbki audio: jeden odtwarzacz naraz
    function fmt(t) { t = Math.floor(t || 0); return Math.floor(t / 60) + ':' + ('0' + t % 60).slice(-2); }
    var players = [];
    document.querySelectorAll('.sample').forEach(function (box) {
      var au = new Audio(); au.preload = 'metadata'; au.src = box.dataset.src;
      var dragging = false;
      var fill = box.querySelector('.fill'), cur = box.querySelector('.cur'), dur = box.querySelector('.dur'), track = box.querySelector('.track');
      players.push(au);
      box.querySelector('.play').addEventListener('click', function () {
        if (au.paused) { players.forEach(function (o) { if (o !== au) o.pause(); }); au.play(); } else au.pause();
      });
      au.addEventListener('play', function () { box.classList.add('playing'); });
      au.addEventListener('pause', function () { box.classList.remove('playing'); });
      au.addEventListener('loadedmetadata', function () { dur.textContent = fmt(au.duration); });
      au.addEventListener('timeupdate', function () {
        if (dragging) return;
        cur.textContent = fmt(au.currentTime);
        fill.style.width = au.duration ? (au.currentTime / au.duration * 100) + '%' : '0';
      });
      au.addEventListener('ended', function () { au.currentTime = 0; });
      function seekTo(e, commit) {
        if (!au.duration) return;
        var r = track.getBoundingClientRect(), f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
        fill.style.width = (f * 100) + '%'; cur.textContent = fmt(f * au.duration);
        if (commit) au.currentTime = f * au.duration;
      }
      track.addEventListener('pointerdown', function (e) {
        if (!au.duration) { au.load(); return; }
        dragging = true; try { track.setPointerCapture(e.pointerId); } catch (x) {}
        seekTo(e, false);
      });
      track.addEventListener('pointermove', function (e) { if (dragging) seekTo(e, false); });
      function endDrag(e) { if (!dragging) return; dragging = false; seekTo(e, true); }
      track.addEventListener('pointerup', endDrag);
      track.addEventListener('pointercancel', function () { dragging = false; });
    });
