<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KrakRoam – kup audioprzewodnik</title>
<meta name="theme-color" content="#14110d">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --dark: #14110d; --gold: #f2b01e; --line: rgba(255,255,255,0.14); --dim: rgba(255,255,255,0.62); }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; background: var(--dark); }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; min-height: 100vh; min-height: 100svh;
    background: linear-gradient(180deg, rgba(20,17,13,0.80) 0%, rgba(20,17,13,0.93) 38%, var(--dark) 70%), url('/www/img/wawel-m.jpg') center top/cover no-repeat, var(--dark); }
  .page { max-width: 460px; margin: 0 auto; padding: 12px 16px calc(175px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 18px; }

  .top { display: flex; align-items: center; justify-content: space-between; position: relative; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; color: #fff; text-decoration: none; }
  .brand img { width: 34px; height: 34px; border-radius: 9px; }
  .flag { display: inline-flex; align-items: center; gap: 7px; border: 0; font: 700 13px/1 'Inter', -apple-system, sans-serif; color: #fff; background: rgba(255,255,255,0.1); padding: 6px 11px 6px 6px; border-radius: 999px; cursor: pointer; }
  .flag svg, .lang-btn svg { width: 24px; height: 16px; border-radius: 3px; flex: none; }
  .langs { display: none; position: absolute; right: 0; top: 44px; z-index: 5; background: #221d16; border: 1px solid var(--line); border-radius: 16px; padding: 6px; box-shadow: 0 14px 40px rgba(0,0,0,0.5); }
  .langs.open { display: grid; }
  .lang-btn { display: flex; align-items: center; gap: 10px; border: 0; background: none; color: #fff; font: 600 15px/1 'Inter', -apple-system, sans-serif; padding: 11px 12px; border-radius: 10px; cursor: pointer; text-align: left; }
  .lang-btn.on { background: rgba(242,176,30,0.16); color: var(--gold); }

  h1 { font-size: 26px; line-height: 1.12; letter-spacing: -0.02em; font-weight: 800; margin-top: 4px; }
  h1 em { font-style: normal; color: var(--gold); }
  .sub { color: var(--dim); font-size: 14px; margin-top: 6px; }
  .hero { text-align: center; }
  .hero .sub { max-width: 320px; margin-left: auto; margin-right: auto; }

  .feats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .feat { background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 14px; padding: 9px 6px; text-align: center; font-size: 12px; font-weight: 600; line-height: 1.25; color: rgba(255,255,255,0.85); }
  .feat svg { width: 20px; height: 20px; color: var(--gold); display: block; margin: 0 auto 5px; }

  .sample { display: flex; align-items: center; gap: 12px; width: 100%; border: 1px solid var(--line); background: rgba(255,255,255,0.06); color: #fff; border-radius: 14px; padding: 8px 12px 8px 8px; font: inherit; text-align: left; cursor: pointer; }
  .sample .pp { width: 36px; height: 36px; flex: none; border-radius: 50%; background: var(--gold); color: var(--dark); display: grid; place-items: center; }
  .sample .pp svg { width: 16px; height: 16px; }
  .sample .i-pause, .sample.playing .i-play { display: none; }
  .sample.playing .i-pause { display: block; }
  .sample b { display: block; font-size: 14px; }
  .sample small { display: block; color: var(--dim); font-size: 12px; }
  .sample .bar { height: 3px; border-radius: 2px; background: rgba(255,255,255,0.15); margin-top: 5px; overflow: hidden; }
  .sample .fill { height: 100%; width: 0; background: var(--gold); }
  .sample .txt { flex: 1; min-width: 0; }

  .opts { display: grid; gap: 8px; margin-top: 4px; }
  .rdesc { margin-left: 0; }
  .opt { position: relative; border: 2px solid var(--line); background: rgba(255,255,255,0.05); border-radius: 18px; padding: 12px 14px; cursor: pointer; transition: border-color .15s, background .15s; }
  .opt.on { border-color: var(--gold); background: rgba(242,176,30,0.10); }
  .opt-head { display: flex; align-items: center; gap: 12px; }
  .radio { width: 22px; height: 22px; flex: none; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); display: grid; place-items: center; }
  .opt.on .radio { border-color: var(--gold); }
  .opt.on .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); }
  .opt-name { flex: 1; min-width: 0; }
  .opt-name b { display: block; font-size: 16px; }
  .opt-name small { display: block; color: var(--dim); font-size: 12.5px; margin-top: 1px; }
  .price { font-size: 22px; font-weight: 800; white-space: nowrap; }
  .price span { font-size: 13px; font-weight: 700; }
  .badge { position: absolute; top: -10px; right: 14px; background: var(--gold); color: var(--dark); font-size: 11px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; }
  .routes { display: none; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .opt.on .routes { display: grid; }
  .route { border: 1.5px solid var(--line); background: rgba(0,0,0,0.25); color: #fff; font: 600 13px/1.2 'Inter', -apple-system, sans-serif; border-radius: 11px; padding: 10px 4px; cursor: pointer; }
  .route.on { border-color: var(--gold); background: var(--gold); color: var(--dark); }

  .desc { display: none; color: rgba(255,255,255,0.78); font-size: 13px; line-height: 1.4; margin: 8px 0 0 34px; }
  .opt.on .desc { display: block; }
  .opt.on .rdesc:empty { display: none; }
  .emails { display: grid; gap: 6px; }
  .warn { display: flex; gap: 8px; align-items: flex-start; color: rgba(255,255,255,0.8); font-size: 12.5px; line-height: 1.35; }
  .warn svg { width: 16px; height: 16px; flex: none; color: var(--gold); margin-top: 1px; }
  .email { width: 100%; font: 500 16px 'Inter', -apple-system, sans-serif; color: #fff; background: rgba(255,255,255,0.08); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; outline: none; }
  .email::placeholder { color: rgba(255,255,255,0.45); }
  .email:focus { border-color: var(--gold); }
  .email.bad { border-color: #e5484d; }

  .pay { width: 100%; border: 0; border-radius: 999px; background: #1fb85a; color: #fff; font: 800 18px/1 'Inter', -apple-system, sans-serif; padding: 17px; cursor: pointer; box-shadow: 0 10px 30px rgba(31,184,90,0.4); }
  .pay:active { transform: scale(0.98); }
  .fine { text-align: center; color: var(--dim); font-size: 12px; line-height: 1.45; }
  .fine b { color: rgba(255,255,255,0.85); font-weight: 600; }
  .bottom { display: grid; gap: 8px; margin-top: 12px; }
  .sec { display: grid; gap: 8px; }
  .kick { color: var(--gold); font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card { background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 16px; padding: 12px; font-size: 13px; line-height: 1.35; color: var(--dim); }
  .card svg { width: 22px; height: 22px; color: var(--gold); display: block; margin-bottom: 6px; }
  .card b { display: block; color: #fff; font-size: 14px; margin-bottom: 2px; }
  .rlist { display: grid; gap: 8px; }
  .rlist div { background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; font-size: 13px; line-height: 1.4; color: var(--dim); }
  .rlist b { display: block; color: #fff; font-size: 15px; margin-bottom: 2px; }

  .buybar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: rgba(20,17,13,0.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 2px solid rgba(242,176,30,0.55); border-radius: 22px 22px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.45); padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }
  .bb-in { max-width: 428px; margin: 0 auto; display: grid; gap: 12px; }
  .bb-txt { flex: 1; min-width: 0; }
  .bb-txt b { display: block; font-size: 19px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bb-txt small { display: block; color: rgba(255,255,255,0.75); font-size: 14px; line-height: 1.35; margin-top: 3px; }
  .buybar { cursor: pointer; }
  .buy-inline { width: 100%; margin-top: 4px; border: 0; border-radius: 999px; background: #1fb85a; color: #fff; font: 800 17px/1 'Inter', -apple-system, sans-serif; padding: 16px; cursor: pointer; box-shadow: 0 8px 24px rgba(31,184,90,0.35); }
  .buy-inline:active { transform: scale(0.98); }
  .bi-price { font-weight: 600; opacity: 0.9; }
  .offer { text-align: center; background: rgba(242,176,30,0.10); border: 1.5px solid rgba(242,176,30,0.5); border-radius: 20px; padding: 18px 16px 16px; display: grid; gap: 6px; }
  .offer b { font-size: 19px; font-weight: 800; }
  .offer span { color: var(--dim); font-size: 14px; }
  .offer .buy-inline { margin-top: 8px; }
  .offer .buy-inline span { color: #fff; font-size: inherit; }
  .bb-btn { border: 0; border-radius: 999px; background: #1fb85a; color: #fff; width: 100%; font: 800 20px/1 'Inter', -apple-system, sans-serif; padding: 18px 24px; cursor: pointer; box-shadow: 0 8px 24px rgba(31,184,90,0.45); white-space: nowrap; animation: pulse 2.4s ease-in-out infinite; }
  .bb-btn:active { transform: scale(0.97); }
  @keyframes pulse { 0%, 100% { box-shadow: 0 8px 24px rgba(31,184,90,0.45), 0 0 0 0 rgba(31,184,90,0.5); } 50% { box-shadow: 0 8px 24px rgba(31,184,90,0.45), 0 0 0 8px rgba(31,184,90,0); } }
  @media (prefers-reduced-motion: reduce) { .bb-btn { animation: none; } }
  .shade { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,0.55); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 460px; margin: 0 auto; max-height: 92vh; max-height: 92svh; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; background: #1c1812; border: 1px solid var(--line); border-bottom: 0; border-radius: 24px 24px 0 0; padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .25s ease; }
  body.buying .shade { opacity: 1; pointer-events: auto; }
  body.buying .sheet { transform: none; }
  body.buying { overflow: hidden; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .sheet-head b { font-size: 19px; font-weight: 800; }
  .x { width: 36px; height: 36px; border: 0; border-radius: 50%; background: rgba(255,255,255,0.1); color: #fff; font-size: 22px; line-height: 1; cursor: pointer; }
  .toast { z-index: 30; }

  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); max-width: 428px; margin: 0 auto; background: #fff; color: var(--dark); font-weight: 600; font-size: 14px; text-align: center; padding: 14px 16px; border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.4); opacity: 0; transform: translateY(10px); transition: opacity .2s, transform .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: none; }

  .hero h1, .hero .sub { transition: opacity .25s ease; }
  .hero.fade h1, .hero.fade .sub { opacity: 0; }
  .hero h1 { min-height: 2.24em; }
  .hero .sub { min-height: 2.9em; }
  .carousel { position: relative; margin: 0 -16px; }
  .slides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; padding: 4px 0 18px; }
  .slides::-webkit-scrollbar { display: none; }
  /* telefony gasną przy krawędziach, zanim dojadą pod strzałki */
  .slides { -webkit-mask-image: linear-gradient(90deg, transparent 0, transparent 8px, #000 56px, #000 calc(100% - 56px), transparent calc(100% - 8px), transparent 100%); mask-image: linear-gradient(90deg, transparent 0, transparent 8px, #000 56px, #000 calc(100% - 56px), transparent calc(100% - 8px), transparent 100%); }
  .slide .phone { will-change: transform, opacity; }
  .slide { flex: 0 0 100%; display: flex; justify-content: center; scroll-snap-align: center; scroll-snap-stop: always; }
  .phone { width: 250px; padding: 7px; border-radius: 40px; background: #0b0a08; border: 1.5px solid rgba(255,255,255,0.22); box-shadow: 0 20px 50px rgba(0,0,0,0.55), 0 0 0 4px rgba(255,255,255,0.04); }
  .phone img { display: block; width: 100%; height: auto; aspect-ratio: 560 / 1192; border-radius: 33px; }
  .arrow { position: absolute; top: 50%; z-index: 2; width: 48px; height: 48px; margin-top: -33px; border: 0; border-radius: 50%; background: var(--gold); color: var(--dark); display: grid; place-items: center; cursor: pointer; box-shadow: 0 8px 22px rgba(0,0,0,0.45); }
  .arrow svg { width: 24px; height: 24px; }
  .arrow:active { transform: scale(0.94); }
  .arrow.prev { left: 10px; } .arrow.next { right: 10px; }
  .dots { display: flex; justify-content: center; gap: 4px; margin-top: -6px; position: relative; }
  .dots button { width: 24px; height: 24px; border: 0; padding: 0; background: none; cursor: pointer; display: grid; place-items: center; }
  .dots button::after { content: ""; width: 7px; height: 7px; border-radius: 999px; background: rgba(255,255,255,0.3); transition: width .2s, background .2s; }
  .dots button.on::after { width: 20px; background: var(--gold); }
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <a class="brand" href="/"><img src="/icon-192.png" alt="">KrakRoam</a>
    <button type="button" class="flag" id="flag" aria-label="Language" aria-expanded="false"></button>
    <div class="langs" id="langs"></div>
  </div>

  <div class="hero" id="hero">
    <h1><span data-i18n="h1a" id="h1a"></span> <em data-i18n="h1b" id="h1b"></em></h1>
    <p class="sub" data-i18n="sub" id="hsub"></p>
  </div>

  <div>
    <div class="carousel">
      <div class="slides" id="slides">
        <div class="slide"><div class="phone"><img src="/www/img/apka-rynek.webp" alt="" width="560" height="1192"></div></div>
        <div class="slide"><div class="phone"><img src="/www/img/apka-punkt.webp" alt="" width="560" height="1192" loading="lazy"></div></div>
        <div class="slide"><div class="phone"><img src="/www/img/apka-nawigacja.webp" alt="" width="560" height="1192" loading="lazy"></div></div>
        <div class="slide"><div class="phone"><img src="/www/img/apka-lista.webp" alt="" width="560" height="1192" loading="lazy"></div></div>
      </div>
      <button type="button" class="arrow prev" id="prev" aria-label="&lsaquo;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button type="button" class="arrow next" id="next" aria-label="&rsaquo;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="dots" id="dots"></div>
  </div>

  <div class="sec">
    <div class="kick" data-i18n="kS"></div>
    <button type="button" class="sample" data-src="/audio/pl/3_1_Legenda_o_trebaczu.mp3">
      <span class="pp"><svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg><svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></span>
      <span class="txt"><b data-i18n="sampleT"></b><small data-i18n="sampleS"></small><span class="bar"><span class="fill"></span></span></span>
    </button>
    <button type="button" class="sample" data-src="/audio/pl/10_1_Piwnice_tortury_i_kat.mp3">
      <span class="pp"><svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg><svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></span>
      <span class="txt"><b data-i18n="sample2T"></b><small data-i18n="sample2S"></small><span class="bar"><span class="fill"></span></span></span>
    </button>
    <button type="button" class="buy-inline open-buy"><span data-i18n="buyNow"></span> <span class="bi-price" data-i18n="fromPrice"></span></button>
  </div>

  <div class="sec">
    <div class="kick" data-i18n="kF"></div>
    <div class="cards">
    <div class="card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.1 7-12a7 7 0 0 0-14 0c0 5.9 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><b data-i18n="c1t"></b><span data-i18n="c1p"></span></div>
    <div class="card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/></svg><b data-i18n="c2t"></b><span data-i18n="c2p"></span></div>
    <div class="card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><path d="M6 2v2M10 2v2M14 2v2"/></svg><b data-i18n="c3t"></b><span data-i18n="c3p"></span></div>
    <div class="card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg><b data-i18n="c4t"></b><span data-i18n="c4p"></span></div>
    </div>
  </div>

  <div class="sec">
    <div class="kick" data-i18n="kR"></div>
    <div class="rlist">
      <div><b data-i18n="rOld"></b><span data-i18n="rdOld"></span></div>
      <div><b>Kazimierz</b><span data-i18n="rdKaz"></span></div>
      <div><b data-i18n="rGhetto"></b><span data-i18n="rdGhetto"></span></div>
    </div>
  </div>

  <div class="offer">
    <b data-i18n="offerT"></b>
    <span data-i18n="offerP"></span>
    <button type="button" class="buy-inline open-buy"><span data-i18n="buyNow"></span> <span class="bi-price" data-i18n="fromPrice"></span></button>
  </div>

</div>

<div class="buybar" id="buybar" role="button" tabindex="0">
  <div class="bb-in">
    <div class="bb-txt"><b id="bb-name"></b><small id="bb-sub"></small></div>
    <button type="button" class="bb-btn" id="bb-btn"><span data-i18n="buy"></span> <span id="bb-price"></span></button>
  </div>
</div>
<div class="shade" id="shade"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-head"><b data-i18n="chooseT"></b><button type="button" class="x" id="x" aria-label="Close">×</button></div>
  <div class="opts" role="radiogroup">
    <div class="opt on" data-opt="all" role="radio" tabindex="0" aria-checked="true">
      <span class="badge" data-i18n="best"></span>
      <div class="opt-head">
        <span class="radio"></span>
        <span class="opt-name"><b data-i18n="allT"></b><small data-i18n="allS"></small></span>
        <span class="price">35 <span>zł</span></span>
      </div>
      <p class="desc" data-i18n="allD"></p>
    </div>
    <div class="opt" data-opt="one" role="radio" tabindex="0">
      <div class="opt-head">
        <span class="radio"></span>
        <span class="opt-name"><b data-i18n="oneT"></b><small data-i18n="oneS"></small></span>
        <span class="price">20 <span>zł</span></span>
      </div>
      <div class="routes">
        <button type="button" class="route" data-route="old" data-i18n="rOld"></button>
        <button type="button" class="route" data-route="kaz">Kazimierz</button>
        <button type="button" class="route" data-route="ghetto" data-i18n="rGhetto"></button>
      </div>
      <p class="desc rdesc" id="rdesc"></p>
    </div>
  </div>

  <div class="bottom">
    <div class="emails">
      <input class="email" id="email" type="email" inputmode="email" autocomplete="email" data-i18n-ph="emailPh">
      <input class="email" id="email2" type="email" inputmode="email" autocomplete="off" data-i18n-ph="email2Ph">
    </div>
    <p class="warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><span data-i18n="warn"></span></p>

      document.documentElement.lang = HTML_LANG[l]; document.title = d.title;
      document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = d[el.dataset.i18n]; });
      document.querySelectorAll('[data-i18n-ph]').forEach(function (el) { el.placeholder = d[el.dataset.i18nPh]; });
      langs.querySelectorAll('.lang-btn').forEach(function (b) { b.classList.toggle('on', b.dataset.lang === l); });
      flag.innerHTML = FLAGS[l] + l.toUpperCase();
      payLabel(); routeDesc();
      try { localStorage.setItem('krakroam_site_lang', l); } catch (e) {}
    }

    document.querySelectorAll('.opt').forEach(function (o) {
      function pick() {
        opt = o.dataset.opt;
        document.querySelectorAll('.opt').forEach(function (x) { x.classList.toggle('on', x === o); x.setAttribute('aria-checked', x === o ? 'true' : 'false'); });
        payLabel();
      }
      o.addEventListener('click', pick);
      o.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
    });
    document.querySelectorAll('.route').forEach(function (r) {
      r.addEventListener('click', function () {
        route = r.dataset.route;
        document.querySelectorAll('.route').forEach(function (x) { x.classList.toggle('on', x === r); });
        routeDesc(); payLabel();
      });
    });

    var toastEl = document.getElementById('toast'), toastT;
    function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove('show'); }, 2600); }

    var email = document.getElementById('email');
    var email2 = document.getElementById('email2');
    [email, email2].forEach(function (el) { el.addEventListener('input', function () { el.classList.remove('bad'); }); });
    pay.addEventListener('click', function () {
      if (opt === 'one' && !route) return toast(T[lang].pickRoute);
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) { email.classList.add('bad'); email.focus(); return toast(T[lang].badEmail); }
      if (email2.value.trim().toLowerCase() !== email.value.trim().toLowerCase()) { email2.classList.add('bad'); email2.focus(); return toast(T[lang].mismatch); }
      // tu podepniemy płatność (Stripe), na razie tylko wygląd
      toast(T[lang].soon);
    });

    var players = [];
    document.querySelectorAll('.sample').forEach(function (btn) {
      var au = new Audio(btn.dataset.src); au.preload = 'none'; players.push(au);
      var fill = btn.querySelector('.fill');
      btn.addEventListener('click', function () {
        if (au.paused) { players.forEach(function (o) { if (o !== au) o.pause(); }); au.play(); } else au.pause();
      });
      au.addEventListener('play', function () { btn.classList.add('playing'); });
      au.addEventListener('pause', function () { btn.classList.remove('playing'); });
      au.addEventListener('timeupdate', function () { fill.style.width = au.duration ? (au.currentTime / au.duration * 100) + '%' : '0'; });
      au.addEventListener('ended', function () { au.currentTime = 0; });
    });

    // pasek zakupu na dole + wysuwany panel
    function openSheet() { document.body.classList.add('buying'); }
    function closeSheet() { document.body.classList.remove('buying'); }
    var buybar = document.getElementById('buybar');
    buybar.addEventListener('click', openSheet);
    document.querySelectorAll('.open-buy').forEach(function (b) { b.addEventListener('click', openSheet); });
    buybar.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSheet(); } });
    document.getElementById('shade').addEventListener('click', closeSheet);
    document.getElementById('x').addEventListener('click', closeSheet);

    var saved = null, q = null;
    try { saved = localStorage.getItem('krakroam_site_lang'); } catch (e) {}
    try { q = new URLSearchParams(location.search).get('lang'); } catch (e) {}
    var nav = 'en', prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
    for (var i = 0; i < prefs.length; i++) {
      var c = String(prefs[i]).slice(0, 2).toLowerCase();
      if (c === 'uk') c = 'ua';
      if (T[c]) { nav = c; break; }
    }
    set(T[q] ? q : (T[saved] ? saved : nav));
  })();
</script>
</body>
</html>
